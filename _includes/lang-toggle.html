{% comment %}
  Language switch behaviour. The chosen language is already applied before paint
  by the snippet in head/custom.html; this only wires the masthead toggle and
  keeps attribute-only strings (placeholders, <option> labels, titles) in sync.
  NOTE: the compress layout folds every page onto one line, so no // comments.
{% endcomment %}
<script>
(function () {
  var KEY = 'site-lang';
  var root = document.documentElement;

  function current() {
    return root.getAttribute('data-lang') === 'zh' ? 'zh' : 'en';
  }

  /* Strings that cannot live in a <span>: they carry data-en / data-zh, and
     data-i18n-attr names the attribute to write (omit it to set the text). */
  function applyAttributes(lang) {
    var nodes = document.querySelectorAll('[data-zh]');
    for (var i = 0; i < nodes.length; i++) {
      var el = nodes[i];
      var value = el.getAttribute(lang === 'zh' ? 'data-zh' : 'data-en');
      if (value === null) { continue; }
      var attr = el.getAttribute('data-i18n-attr');
      if (attr) { el.setAttribute(attr, value); } else { el.textContent = value; }
    }
  }

  function apply(lang) {
    root.setAttribute('data-lang', lang);
    root.setAttribute('lang', lang === 'zh' ? 'zh-Hans' : 'en');
    var toggle = document.getElementById('lang-toggle');
    if (toggle) {
      toggle.setAttribute('aria-label', lang === 'zh' ? 'Switch to English / 切换到英文' : 'Switch to Chinese / 切换到中文');
    }
    applyAttributes(lang);
    document.dispatchEvent(new CustomEvent('langchange', { detail: { lang: lang } }));
  }

  function toggle() {
    var next = current() === 'zh' ? 'en' : 'zh';
    try { window.localStorage.setItem(KEY, next); } catch (e) {}
    apply(next);
  }

  function ready() {
    apply(current());
    var btn = document.getElementById('lang-toggle');
    if (!btn) { return; }
    btn.addEventListener('click', function (e) { e.preventDefault(); toggle(); });
    btn.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); toggle(); }
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', ready);
  } else {
    ready();
  }
})();
</script>
